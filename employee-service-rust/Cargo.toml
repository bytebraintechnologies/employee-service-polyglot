[package]
name = "employee-service-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.3.1"
actix-cors = "0.6.4"

# Serialization/Deserialization
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"

# Async Runtime
tokio = { version = "1.28.2", features = ["full"] }

# Logging
env_logger = "0.10.0"
log = "0.4.17"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
tracing-appender = "0.2.2"

# UUID generation
uuid = { version = "1.3.3", features = ["v4", "serde"] }

# Email validation (similar to EmailStr in Pydantic)
validator = { version = "0.16.1", features = ["derive"] }
regex = "1.8.1"

# Environment variables
dotenv = "0.15.0"

# System information
sys-info = "0.9.1"
chrono = "0.4.24"

# Error handling
thiserror = "1.0.40"
anyhow = "1.0.71"

# Lazy static for singleton instance
lazy_static = "1.4.0"

# For futures
futures = "0.3.28"

[dev-dependencies]
# For testing
actix-rt = "2.8.0"
