version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend-Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - java-service
      - nodejs-service
      - python-service
      - go-service
      - rust-service
      - cpp-service
      - ruby-service
      - csharp-service
      - clojure-service
      - scala-service
    networks:
      - app-network

  java-service:
    build: ./employee-service-java
    container_name: java-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - app-network

  nodejs-service:
    build: ./employee-service-nodejs
    container_name: nodejs-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - app-network

  python-service:
    build: ./employee-service-python
    container_name: python-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    networks:
      - app-network

  go-service:
    build: ./employee-service-go
    container_name: go-service
    ports:
      - "7070:7070"
    environment:
      - PORT=7070
    networks:
      - app-network

  rust-service:
    build: ./employee-service-rust
    container_name: rust-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    networks:
      - app-network

  cpp-service:
    build: ./employee-service-cpp
    container_name: cpp-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
    networks:
      - app-network

  ruby-service:
    build: ./employee-service-ruby
    container_name: ruby-service
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    networks:
      - app-network

  csharp-service:
    build: ./employee-service-csharp
    container_name: csharp-service
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
    networks:
      - app-network

  clojure-service:
    build: ./employee-service-clojure
    container_name: clojure-service
    ports:
      - "8087:8087"
    environment:
      - PORT=8087
    networks:
      - app-network

  scala-service:
    build: ./employee-service-scala
    container_name: scala-service
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
    networks:
      - app-network

networks:
  app-network:
    driver: bridge